<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1c1917"/>
      <stop offset="100%" stop-color="#292524"/>
    </linearGradient>
    <linearGradient id="sunGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fadc40"/>
      <stop offset="60%" stop-color="#f64d0b"/>
      <stop offset="100%" stop-color="#d43d06"/>
    </linearGradient>
    <linearGradient id="waveGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>
  </defs>

  <!-- Background rounded squircle -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)"/>
  
  <!-- Subtle inner border -->
  <rect x="8" y="8" width="496" height="496" rx="120" fill="none" stroke="rgba(255,255,255,0.12)" stroke-width="4"/>

  <!-- Radiant Sun -->
  <circle cx="256" cy="220" r="100" fill="url(#sunGrad)"/>

  <!-- Sun rays -->
  <g stroke="url(#sunGrad)" stroke-width="12" stroke-linecap="round" opacity="0.85">
    <line x1="256" y1="80" x2="256" y2="105"/>
    <line x1="256" y1="335" x2="256" y2="360"/>
    <line x1="116" y1="220" x2="141" y2="220"/>
    <line x1="371" y1="220" x2="396" y2="220"/>
    <line x1="157" y1="121" x2="175" y2="139"/>
    <line x1="337" y1="301" x2="355" y2="319"/>
    <line x1="355" y1="121" x2="337" y2="139"/>
    <line x1="175" y1="301" x2="157" y2="319"/>
  </g>

  <!-- Ocean Waves -->
  <path d="M128 320 Q 192 290 256 320 T 384 320" fill="none" stroke="url(#waveGrad)" stroke-width="14" stroke-linecap="round"/>
  <path d="M110 360 Q 183 330 256 360 T 402 360" fill="none" stroke="url(#waveGrad)" stroke-width="14" stroke-linecap="round" opacity="0.75"/>
</svg>
